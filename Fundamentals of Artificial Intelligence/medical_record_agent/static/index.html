<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI生成式电子病历辅助系统</title>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --bg: #f3f4f6;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 34px;
        background: var(--surface);
        box-shadow: 0 14px 36px rgba(17, 24, 39, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }

      p {
        margin: 10px 0 26px;
        color: var(--muted);
        line-height: 1.7;
      }

      .entry-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      a {
        display: grid;
        gap: 8px;
        min-height: 118px;
        align-content: center;
        border: 1px solid #bfdbfe;
        border-radius: 14px;
        padding: 20px;
        background: #eff6ff;
        color: var(--text);
        text-decoration: none;
      }

      a strong {
        color: var(--primary-dark);
        font-size: 18px;
      }

      a span {
        color: var(--muted);
        line-height: 1.55;
      }

      a:hover {
        border-color: var(--primary);
        box-shadow: 0 10px 22px rgba(59, 130, 246, 0.14);
      }

      @media (max-width: 640px) {
        main {
          padding: 24px;
        }

        .entry-actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI生成式电子病历辅助系统</h1>
      <p>请选择进入医生端工作台，或进入保留完整开发能力的调试页。</p>
      <div class="entry-actions">
        <a href="./doctor.html">
          <strong>进入医生端</strong>
          <span>三栏医生工作台，支持文本导入、音频转写、生成病历和 ASR 评测。</span>
        </a>
        <a href="./debug.html">
          <strong>进入调试页</strong>
          <span>保留文本生成、音频上传、ASR 评测、SSE 进度和 JSON 调试能力。</span>
        </a>
      </div>
    </main>
  </body>
</html>
