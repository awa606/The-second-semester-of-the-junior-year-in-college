<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>病历生成 Agent V0.2</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --line: #d8dee9;
        --text: #17202a;
        --muted: #64748b;
        --blue: #1f6feb;
        --green: #15803d;
        --red: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 18px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 15px;
        line-height: 1.3;
      }

      button {
        min-height: 38px;
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #334155;
      }

      button:disabled {
        background: #94a3b8;
        cursor: not-allowed;
      }

      input[type="file"],
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      input[type="file"] {
        padding: 9px;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
        padding: 10px;
        line-height: 1.55;
      }

      pre {
        min-height: 110px;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fbfcfe;
        font-size: 13px;
        line-height: 1.5;
      }

      .status {
        padding: 8px 12px;
        border: 1px solid #bfdbfe;
        border-radius: 6px;
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 14px;
      }

      .entry-grid,
      .result-grid {
        display: grid;
        gap: 12px;
      }

      .entry-grid {
        grid-template-columns: repeat(3, minmax(260px, 1fr));
        margin-bottom: 12px;
      }

      .result-grid {
        grid-template-columns: minmax(300px, 0.9fr) minmax(340px, 1.1fr) minmax(320px, 1fr);
      }

      .panel {
        padding: 12px;
        border: 1px solid #e3e8f0;
        border-radius: 6px;
        background: var(--panel);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .progress {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .progress li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
      }

      .progress li.active {
        border-color: #93c5fd;
        background: #eff6ff;
        color: #1d4ed8;
      }

      .progress li.done {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: var(--green);
      }

      .progress li.failed {
        border-color: #fecaca;
        background: #fef2f2;
        color: var(--red);
      }

      .meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 1080px) {
        header {
          align-items: stretch;
          flex-direction: column;
        }

        .entry-grid,
        .result-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>病历生成 Agent V0.2</h1>
          <div id="taskMeta" class="meta">未创建任务</div>
        </div>
        <span id="statusText" class="status">等待输入</span>
      </header>

      <div class="entry-grid">
        <section class="panel stack">
          <h2>从文本生成病历</h2>
          <textarea id="conversationInput">[医生] 你好，哪里不舒服？
[患者] 左手手掌被蛇咬伤了，肿痛两个小时左右。
[医生] 被咬后做过什么处理吗？
[患者] 用酒精冲洗了，绑了绷带，吃了季德胜蛇药片。
[医生] 现在除了咬伤部位不舒服，还有什么其他难受的？
[患者] 现在有些畏寒、头晕、胸闷、心慌，牙龈也有些出血。</textarea>
          <button id="generateTextButton">从文本生成病历</button>
        </section>

        <section class="panel stack">
          <h2>上传预录音频测试转写</h2>
          <input id="asrOnlyFile" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
          <button id="transcribeOnlyButton" class="secondary">测试 Mock ASR</button>
        </section>

        <section class="panel stack">
          <h2>上传预录音频生成病历</h2>
          <input id="audioRecordFile" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
          <button id="audioGenerateButton">音频生成病历</button>
        </section>
      </div>

      <div class="result-grid">
        <section class="panel stack">
          <h2>任务进度</h2>
          <ul id="progressList" class="progress"></ul>
          <h2>ASR 测试结果</h2>
          <pre id="asrOutput">-</pre>
        </section>

        <section class="panel stack">
          <h2>结构化字段 JSON</h2>
          <pre id="fieldsOutput">-</pre>
          <h2>病历草稿</h2>
          <pre id="draftOutput">-</pre>
        </section>

        <section class="panel stack">
          <h2>安全校验结果</h2>
          <pre id="safetyOutput">-</pre>
          <h2>步骤日志</h2>
          <pre id="stepsOutput">-</pre>
        </section>
      </div>
    </main>

    <script>
      const PROGRESS_STEPS = [
        ["CREATED", "任务已创建"],
        ["EXTRACTING_FIELDS", "字段抽取"],
        ["GENERATING_DRAFT", "草稿生成"],
        ["SAFETY_CHECKING", "安全校验"],
        ["WAITING_DOCTOR_REVIEW", "等待医生审核"],
      ];

      const generateTextButton = document.getElementById("generateTextButton");
      const transcribeOnlyButton = document.getElementById("transcribeOnlyButton");
      const audioGenerateButton = document.getElementById("audioGenerateButton");
      const conversationInput = document.getElementById("conversationInput");
      const asrOnlyFile = document.getElementById("asrOnlyFile");
      const audioRecordFile = document.getElementById("audioRecordFile");
      const statusText = document.getElementById("statusText");
      const taskMeta = document.getElementById("taskMeta");
      const progressList = document.getElementById("progressList");
      const asrOutput = document.getElementById("asrOutput");
      const fieldsOutput = document.getElementById("fieldsOutput");
      const draftOutput = document.getElementById("draftOutput");
      const safetyOutput = document.getElementById("safetyOutput");
      const stepsOutput = document.getElementById("stepsOutput");

      function setBusy(isBusy) {
        generateTextButton.disabled = isBusy;
        transcribeOnlyButton.disabled = isBusy;
        audioGenerateButton.disabled = isBusy;
      }

      function resetProgress() {
        progressList.innerHTML = "";
        for (const [status, label] of PROGRESS_STEPS) {
          const item = document.createElement("li");
          item.dataset.status = status;
          item.innerHTML = `<span>${label}</span><strong>${status}</strong>`;
          progressList.appendChild(item);
        }
      }

      function resetRecordOutputs() {
        fieldsOutput.textContent = "-";
        draftOutput.textContent = "-";
        safetyOutput.textContent = "-";
        stepsOutput.textContent = "-";
      }

      function markProgress(status, failed = false) {
        const order = PROGRESS_STEPS.map(([stepStatus]) => stepStatus);
        const activeIndex = order.indexOf(status);
        for (const item of progressList.children) {
          const itemIndex = order.indexOf(item.dataset.status);
          item.className = "";
          if (failed) {
            if (itemIndex <= Math.max(activeIndex, 0)) item.classList.add("failed");
          } else if (itemIndex < activeIndex || status === "WAITING_DOCTOR_REVIEW") {
            item.classList.add("done");
          } else if (itemIndex === activeIndex) {
            item.classList.add("active");
          }
        }
      }

      function renderJson(element, value) {
        element.textContent = JSON.stringify(value ?? {}, null, 2);
      }

      function renderAsr(result) {
        renderJson(asrOutput, {
          engine: result.engine,
          text: result.text,
          conversation_text: result.conversation_text,
          segments: result.segments,
          medical_keywords: result.medical_keywords,
        });
      }

      async function api(path, options = {}) {
        const response = await fetch(path, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(JSON.stringify(data.detail || data, null, 2));
        }
        return data;
      }

      async function uploadAndTranscribe(file) {
        if (!file) throw new Error("请选择 wav 或 mp3 文件");
        const form = new FormData();
        form.append("file", file);

        statusText.textContent = "正在上传音频";
        const uploaded = await api("/api/audio/upload", {
          method: "POST",
          body: form,
        });

        statusText.textContent = `音频 ${uploaded.audio_id}: 正在 Mock ASR 转写`;
        const transcribed = await api(`/api/audio/${uploaded.audio_id}/transcribe`, {
          method: "POST",
        });
        renderAsr(transcribed.asr_result);
        statusText.textContent = `音频 ${uploaded.audio_id}: Mock ASR 完成`;
        return transcribed;
      }

      async function renderTask(taskId, taskFromEvent = null) {
        const task = taskFromEvent || await api(`/api/tasks/${taskId}`);
        const result = task.result_json || {};
        const steps = await api(`/api/tasks/${taskId}/steps`);

        taskMeta.textContent = `任务 ${task.id} / ${task.status}`;
        renderJson(fieldsOutput, result.fields);
        draftOutput.textContent = result.draft || "-";
        renderJson(safetyOutput, result.safety_check);
        renderJson(stepsOutput, steps);
      }

      function listenForEvents(taskId, eventsUrl) {
        const events = new EventSource(eventsUrl);
        const statuses = ["CREATED", "EXTRACTING_FIELDS", "GENERATING_DRAFT", "SAFETY_CHECKING", "DEGRADED"];
        let terminalReceived = false;

        for (const status of statuses) {
          events.addEventListener(status, (event) => {
            const data = JSON.parse(event.data);
            statusText.textContent = `任务 ${data.task_id}: ${data.status}`;
            taskMeta.textContent = `任务 ${data.task_id} / ${data.current_stage || data.status}`;
            markProgress(data.status);
          });
        }

        events.addEventListener("WAITING_DOCTOR_REVIEW", async (event) => {
          const data = JSON.parse(event.data);
          terminalReceived = true;
          statusText.textContent = `任务 ${data.task_id}: 等待医生审核`;
          markProgress("WAITING_DOCTOR_REVIEW");
          await renderTask(data.task_id, data.task);
          events.close();
          setBusy(false);
        });

        events.addEventListener("FAILED", async (event) => {
          const data = JSON.parse(event.data);
          terminalReceived = true;
          statusText.textContent = `任务 ${data.task_id}: FAILED`;
          markProgress(data.status, true);
          await renderTask(data.task_id, data.task);
          events.close();
          setBusy(false);
        });

        events.onerror = () => {
          if (terminalReceived) {
            events.close();
            return;
          }
          statusText.textContent = "任务事件连接异常";
          events.close();
          setBusy(false);
        };
      }

      async function createRecordTask(conversationText) {
        resetProgress();
        resetRecordOutputs();
        statusText.textContent = "正在创建任务";
        taskMeta.textContent = "正在创建任务";
        const created = await api("/api/records/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_text: conversationText }),
        });
        statusText.textContent = `任务 ${created.task_id}: ${created.status}`;
        taskMeta.textContent = `任务 ${created.task_id} / ${created.status}`;
        markProgress(created.status);
        listenForEvents(created.task_id, created.events_url);
      }

      generateTextButton.addEventListener("click", async () => {
        const conversationText = conversationInput.value.trim();
        if (!conversationText) {
          statusText.textContent = "请输入医患对话文本";
          return;
        }
        setBusy(true);
        try {
          await createRecordTask(conversationText);
        } catch (error) {
          statusText.textContent = error.message;
          setBusy(false);
        }
      });

      transcribeOnlyButton.addEventListener("click", async () => {
        setBusy(true);
        resetRecordOutputs();
        try {
          await uploadAndTranscribe(asrOnlyFile.files[0]);
        } catch (error) {
          statusText.textContent = error.message;
        } finally {
          setBusy(false);
        }
      });

      audioGenerateButton.addEventListener("click", async () => {
        setBusy(true);
        resetProgress();
        resetRecordOutputs();
        try {
          const transcribed = await uploadAndTranscribe(audioRecordFile.files[0]);
          statusText.textContent = "正在用转写文本创建病历任务";
          const created = await api(`/api/audio/${transcribed.audio_id}/generate-record`, {
            method: "POST",
          });
          statusText.textContent = `任务 ${created.task_id}: ${created.status}`;
          taskMeta.textContent = `任务 ${created.task_id} / ${created.status}`;
          markProgress(created.status);
          listenForEvents(created.task_id, created.events_url);
        } catch (error) {
          statusText.textContent = error.message;
          setBusy(false);
        }
      });

      resetProgress();
    </script>
  </body>
</html>
